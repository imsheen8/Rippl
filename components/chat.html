  <!-- Chat -->
  <div class="screen" id="chat">
    <div class="chh">
      <button id="chBack" aria-label="Back"><i data-lucide="arrow-left"></i></button>
      <div id="chAvW"></div>
      <div class="cht" id="chHd"><b id="chName" dir="auto"></b><small id="chSt"></small></div>
      <button aria-label="Voice call" id="chCall"><i data-lucide="phone"></i></button>
      <button aria-label="Video call" id="chVid"><i data-lucide="video"></i></button>
    </div>
    <div class="chbody" id="chBody"></div>
    <div class="chin">
      <div class="emo" id="chEmo"></div>
      <div class="cfield">
        <button class="cb cpl" id="chPlus" aria-label="Add"><i data-lucide="plus"></i></button>
        <input id="chInput" dir="auto" placeholder="Message" autocomplete="off" enterkeyhint="send">
        <button class="cb" id="chImgB" aria-label="Photo"><i data-lucide="image"></i></button>
        <button class="cb" id="chEmoB" aria-label="Emoji"><i data-lucide="smile"></i></button>
        <button class="csend off" id="chSend" aria-label="Send"><i data-lucide="send"></i></button>
      </div>
      <input type="file" id="chFile" accept="image/*" hidden>
    </div>
  </div>

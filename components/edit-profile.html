  <!-- Edit profile -->
  <div class="screen" id="pedit">
    <div class="pe-head">
      <button id="peBack" aria-label="Back"><i data-lucide="arrow-left"></i></button>
      <b>Edit profile</b>
      <button id="peSave" class="pe-save" type="button">Save</button>
    </div>
    <div class="pe-body">
      <div class="pe-banner" id="peBanner"><button id="peBannerBtn" type="button"><i data-lucide="camera"></i><span>Change banner</span></button></div>
      <div class="pe-avwrap">
        <div class="pe-av"><img id="peAvImg" alt=""><button id="peAvBtn" type="button" aria-label="Change photo"><i data-lucide="camera"></i></button></div>
        <div class="pe-link" id="peAvLink">Change photo</div>
      </div>
      <div class="pe-card">
        <label class="pe-row"><span>Name</span><input id="peName" maxlength="40" dir="ltr" autocomplete="off"></label>
        <label class="pe-row"><span>Username</span><input id="peUser" maxlength="20" dir="ltr" autocapitalize="none" autocomplete="off" spellcheck="false"></label>
      </div>
      <div class="pe-lbl">Basics</div>
      <div class="pe-card"><label class="pe-row top"><span>Bio</span><textarea id="peBio" maxlength="200" rows="5" dir="ltr" placeholder="Write a short description about you"></textarea></label></div>
      <div class="pe-msg" id="peMsg" role="status" aria-live="polite"></div>
    </div>
    <input type="file" id="peFileAv" accept="image/*" hidden>
    <input type="file" id="peFileBn" accept="image/*" hidden>
  </div>

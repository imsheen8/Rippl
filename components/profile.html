  <!-- Profile -->
  <div class="screen" id="prof">
    <div class="pscroll">
      <div class="dtop">
        <div class="dban"></div>
        <button class="dx" id="pClose" aria-label="Close"><i data-lucide="x"></i></button>
        <button class="dx dedit" id="pEdit" aria-label="Edit"><i data-lucide="pencil"></i></button>
        <button class="dx dset" id="pSettings" aria-label="Settings"><i data-lucide="settings"></i></button>
        <div class="dav"><div class="av" data-img="me" data-fb="R"></div><span class="dst" data-st="online"></span></div>
        
      </div>
      <div class="dinfo">
        <div class="pname" data-vid="me">Add your name </div>
        <div class="dun">Add a username</div>
        <div class="pstats"><div><b>0</b><span>Following</span></div><div><b>0</b><span>Followers</span></div><div><b>0</b><span>Likes</span></div></div>
        <button class="pe-setup" id="pSetup" type="button" hidden>Complete your profile</button>
      </div>
      <div class="pbio" dir="auto" hidden></div>
      <div class="ptabs">
        <div class="on" data-t="0"><i data-lucide="newspaper"></i></div>
        <div data-t="1"><i data-lucide="lock"></i></div>
        <div data-t="2"><i data-lucide="repeat-2"></i></div>
        <div data-t="3"><i data-lucide="bookmark"></i></div>
        <div data-t="4"><i data-lucide="heart"></i></div>
      </div>
      <div id="myPosts" class="pfeed"></div><div class="pempty"><i data-lucide="images"></i><p id="pemptyTxt">What are some good photos you’ve taken recently?</p><button class="pup" id="pemptyBtn">Upload</button></div>
    </div>
  </div>

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Fixed signing key: if the four secrets exist the APK is signed with the same key every time, so the app updates over the old install.
      - name: Check signing key
        id: key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KK: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ] && [ -n "$KA" ] && [ -n "$KK" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/sheen.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/sheen.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KP" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KA" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KK" >> "$GITHUB_ENV"
            echo "SIGNING=1" >> "$GITHUB_ENV"
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets - building a debug APK (uninstall the old app before installing a new build)."
          fi

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r icons www/

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons and splash
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Patch Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: python3 scripts/patch-android.py

      - name: Sync web files
        run: npx cap sync android

      - name: Build signed APK
        if: steps.key.outputs.signed == '1'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build debug APK
        if: steps.key.outputs.signed != '1'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sheen-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
